<!doctype html>
<html>
    <head>
        <title>TP - Progressive Mesh Viewer</title>
        <meta charset="utf-8">
        <style>
            body {
                overflow: hidden;
                margin: 0px;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            }

            #bottombar {
                position: absolute;
                bottom: 15px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                align-items: center;
                gap: 12px;
                background: rgba(20, 24, 33, 0.88);
                padding: 10px 22px;
                border-radius: 30px;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
                backdrop-filter: blur(8px);
                color: white;
                user-select: none;
            }

            progress {
                width: 260px;
                height: 12px;
                border-radius: 6px;
                overflow: hidden;
            }

            #percentage {
                font-weight: bold;
                min-width: 50px;
                font-size: 14px;
            }

            button {
                background: #2980b9;
                color: white;
                border: none;
                padding: 7px 15px;
                border-radius: 18px;
                font-weight: 600;
                font-size: 13px;
                cursor: pointer;
                transition: all 0.2s ease;
                display: flex;
                align-items: center;
                gap: 5px;
            }

            button:hover {
                transform: scale(1.04);
                box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            }

            #btnPause {
                background: #2980b9;
            }

            #btnScreenshot {
                background: #27ae60;
            }

            #btnScreenshot:hover {
                background: #2ecc71;
            }

            select.qos-select {
                background: rgba(255, 255, 255, 0.12);
                color: white;
                border: 1px solid rgba(255, 255, 255, 0.25);
                padding: 5px 8px;
                border-radius: 12px;
                font-size: 12px;
                font-weight: 600;
                cursor: pointer;
                outline: none;
            }

            select.qos-select option {
                background: #141821;
                color: white;
            }

            #qosStatus {
                font-size: 12px;
                color: #cbd5e1;
                white-space: nowrap;
            }

            #errormessage {
                position: absolute;
                top: 15px;
                left: 20px;
                color: #e74c3c;
                font-weight: bold;
                background: rgba(0,0,0,0.7);
                padding: 6px 12px;
                border-radius: 6px;
                display: none;
            }
        </style>
    </head>
    <body>
        <div id="errormessage"></div>
        <div id="bottombar">
            <button id="btnPause" onclick="togglePause()">⏸️ Pause</button>
            <progress id="progressbar" value=0 max=10000></progress>
            <span id="percentage">0%</span>
            <select id="qosMode" class="qos-select" onchange="onStreamingSettingChange()" title="Politique de taille des blocs">
                <option value="qos" selected>QoS Adaptatif</option>
                <option value="fixed">Fixe (1 Ko)</option>
            </select>
            <select id="netProfile" class="qos-select" onchange="onStreamingSettingChange()" title="Simulation débit réseau (Chen & Nishita Table 5)">
                <option value="0" selected>Réseau réel</option>
                <option value="1000">10BaseT (1 Mbps)</option>
                <option value="64">Bas débit (64 kbps)</option>
            </select>
            <span id="qosStatus">Lot: 1.0 Ko | Débit: — | 0 req</span>
            <button onclick="restartStreaming()" title="Relancer le streaming">↻</button>
            <button id="btnScreenshot" onclick="takeScreenshot()">📸 Capture</button>
        </div>
        <script src="js/three.min.js"></script>
        <script src="js/OrbitControls.js"></script>
        <script src="js/obja.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
